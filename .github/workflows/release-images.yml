name: release-images

# The official image release of ONE version tag vMAJOR.MINOR.PATCH, for example v0.0.1:
#   ghcr.io/pallassoftware/pathena/{loginserver,charserver,mapserver,worldserver}:<tag>
# Started for every new tag by release-version.yml (workflow_dispatch on the tag) or by pushing a v* tag. It compares the tag
# with the previous release tag (git diff over each server's source, shared code, dependencies and build inputs), builds only
# the servers that changed, and gives every unchanged server the new tag on its existing image digest (no rebuild, so its
# version labels stay those of the build). All four tags exist after every release.
# Safe to re-run: an image tag that already exists is never overwritten or rebuilt, so a partially failed release is
# completed by running it again. It never deploys anything; pathena-server selects a release and deploys on its own.

permissions:
  contents: read

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/release-images.yml"
  workflow_dispatch:

jobs:
  retag-digest:
    name: Re-tag keeps the digest (real registry)
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true
      - name: Build, push and re-tag a single-platform image, compare digests
        shell: pwsh
        run: ./.github/scripts/Test-RetagRegistry.ps1

  publish:
    name: Publish the images
    needs: retag-digest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check out the rAthena data the WorldServer image carries
        run: git submodule update --init --depth 1 legacy/rathena
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: ./.github/scripts/Publish-ReleaseImages.ps1 -Tag $env:TAG -SourceUrl $env:SOURCE_URL
